<svg viewBox="0 0 420 760" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F3ECDC"/>
      <stop offset="100%" stop-color="#E7DCC4"/>
    </linearGradient>
    <linearGradient id="potLeft" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E3A574"/>
      <stop offset="100%" stop-color="#C9814F"/>
    </linearGradient>
    <linearGradient id="potLeft2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#EFE3CC"/>
      <stop offset="100%" stop-color="#DACBA8"/>
    </linearGradient>
  </defs>

  <rect width="420" height="760" fill="url(#bgLeft)"/>

  <!-- luz suave ao fundo -->
  <circle cx="330" cy="140" r="150" fill="#F8EFD9" opacity="0.5"/>

  <!-- macramê pendurado -->
  <g>
    <rect x="70" y="60" width="130" height="10" rx="5" fill="#8A6A47"/>
    <line x1="90" y1="70" x2="80" y2="230" stroke="#E9DFC9" stroke-width="4"/>
    <line x1="115" y1="70" x2="100" y2="240" stroke="#E9DFC9" stroke-width="4"/>
    <line x1="135" y1="70" x2="135" y2="255" stroke="#E9DFC9" stroke-width="4"/>
    <line x1="155" y1="70" x2="170" y2="240" stroke="#E9DFC9" stroke-width="4"/>
    <line x1="180" y1="70" x2="190" y2="230" stroke="#E9DFC9" stroke-width="4"/>
    <path d="M80,180 Q135,215 190,180" stroke="#DCCFAE" stroke-width="4" fill="none"/>
    <path d="M85,140 Q135,170 185,140" stroke="#DCCFAE" stroke-width="4" fill="none"/>
  </g>

  <!-- prateleira de madeira -->
  <rect x="0" y="560" width="420" height="26" fill="#A97A4E"/>
  <rect x="0" y="586" width="420" height="8" fill="#8A6038"/>

  <!-- vaso de cerâmica grande com folhagem -->
  <g>
    <path d="M40,560 L60,470 L150,470 L170,560 Z" fill="url(#potLeft)"/>
    <ellipse cx="105" cy="470" rx="45" ry="10" fill="#B8703F"/>
    <!-- folhas -->
    <g stroke="#5E7A4C" stroke-width="6" fill="none" stroke-linecap="round">
      <path d="M105,470 Q70,380 60,300"/>
      <path d="M105,470 Q95,360 110,270"/>
      <path d="M105,470 Q130,370 150,290"/>
      <path d="M105,470 Q140,400 165,340"/>
      <path d="M105,470 Q80,410 50,360"/>
    </g>
    <g fill="#6E8C58">
      <ellipse cx="60" cy="300" rx="16" ry="34" transform="rotate(-25 60 300)"/>
      <ellipse cx="110" cy="268" rx="15" ry="36" transform="rotate(2 110 268)"/>
      <ellipse cx="150" cy="288" rx="15" ry="34" transform="rotate(28 150 288)"/>
      <ellipse cx="165" cy="338" rx="13" ry="28" transform="rotate(45 165 338)"/>
      <ellipse cx="50" cy="358" rx="13" ry="28" transform="rotate(-45 50 358)"/>
    </g>
  </g>

  <!-- vasinho pequeno com suculenta -->
  <g>
    <path d="M210,560 L220,510 L280,510 L290,560 Z" fill="url(#potLeft2)"/>
    <ellipse cx="250" cy="510" rx="30" ry="8" fill="#C9BB98"/>
    <g fill="#7C9C68">
      <path d="M250,510 Q235,480 240,455 Q250,478 250,510 Z"/>
      <path d="M250,510 Q265,478 262,452 Q252,478 250,510 Z"/>
      <path d="M250,510 Q225,495 218,470 Q240,485 250,510 Z"/>
      <path d="M250,510 Q275,495 282,470 Q260,485 250,510 Z"/>
    </g>
  </g>

  <!-- jarra de barro -->
  <g>
    <path d="M320,560 C310,520 315,495 335,480 C355,495 360,520 350,560 Z" fill="url(#potLeft)"/>
    <ellipse cx="335" cy="480" rx="14" ry="6" fill="#B8703F"/>
    <path d="M335,480 Q320,440 335,410" stroke="#5E7A4C" stroke-width="5" fill="none" stroke-linecap="round"/>
    <ellipse cx="335" cy="408" rx="10" ry="20" fill="#6E8C58" transform="rotate(10 335 408)"/>
  </g>

  <!-- textura de chão -->
  <rect x="0" y="594" width="420" height="166" fill="#F0E7D3"/>
</svg>
